<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AOL Email Sender</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; }
    input, textarea, button { width: 100%; margin-bottom: 12px; padding: 8px; box-sizing: border-box; }
    textarea { height: 100px; }
  </style>
</head>
<body>
  <h2>Send an Email via AOL</h2>
  <form id="emailForm">
    <input type="email" id="to" placeholder="Recipient Email" required />
    <input type="text" id="subject" placeholder="Subject Line" required />
    <textarea id="htmlBody" placeholder="HTML Body (e.g. <a href='https://google.com'>Link</a>)"></textarea>
    
    <label>Delay sending (seconds, max 8):</label>
    <input type="number" id="delaySeconds" value="0" min="0" max="8" />
    
    <label>Attachment:</label>
    <input type="file" id="fileInput" />

    <button type="submit" id="sendBtn">Send Email</button>
  </form>

  <p id="status"></p>

  <script>
    document.getElementById("emailForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const btn = document.getElementById("sendBtn");
      
      status.innerText = "Sending email...";
      btn.disabled = true;

      const fileInput = document.getElementById("fileInput");
      let fileBase64 = null;
      let fileName = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        to: document.getElementById("to").value,
        subject: document.getElementById("subject").value,
        htmlBody: document.getElementById("htmlBody").value,
        delaySeconds: parseInt(document.getElementById("delaySeconds").value),
        fileBase64,
        fileName
      };

      try {
        const res = await fetch("/.netlify/functions/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        
        if (res.ok) {
          status.innerText = "Success! Email sent.";
        } else {
          status.innerText = "Error: " + (result.error || "Failed to send.");
        }
      } catch (err) {
        status.innerText = "Failed to communicate with the server.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
