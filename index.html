<!DOCTYPE html>
<html>
<head>
  <title>My Email Sender</title>
</head>
<body>
  <h2>Send an Email via AOL</h2>
  <form id="emailForm">
    <p><input type="email" id="to" placeholder="Recipient Email" required style="width:300px;"></p>
    <p><input type="text" id="subject" placeholder="Subject Line" required style="width:300px;"></p>
    <p><textarea id="htmlBody" placeholder="Message content. Links allowed: <a href='https://google.com'>Click Here</a>" style="width:300px; height:100px;"></p>
    <p><label>Optional Delay (1 to 8 seconds): </label><input type="number" id="delaySeconds" value="0" min="0" max="8"></p>
    <p><label>Attach File: </label><input type="file" id="fileInput"></p>
    <p><button type="submit">Send Email Now</button></p>
  </form>
  <p id="status"></p>

  <script>
    document.getElementById("emailForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      status.innerText = "Sending... Please wait.";

      const fileInput = document.getElementById("fileInput");
      let fileBase64 = null;
      let fileName = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        to: document.getElementById("to").value,
        subject: document.getElementById("subject").value,
        htmlBody: document.getElementById("htmlBody").value,
        delaySeconds: parseInt(document.getElementById("delaySeconds").value),
        fileBase64,
        fileName
      };

      try {
        const res = await fetch("/.netlify/functions/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (res.ok) {
          status.innerText = "Success! Email sent.";
        } else {
          status.innerText = "Error: " + result.error;
        }
      } catch (err) {
        status.innerText = "Failed to communicate with the server.";
      }
    });
  </script>
</body>
</html>
